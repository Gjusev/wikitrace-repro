[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wikitrace-repro"
version = "0.1.0"
description = "Offline repro/test harness for WikiTrace (arXiv:2611.14320): evidence-linked agent memory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["agent-memory", "reliability", "reproduction", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools]
packages = ["wikitrace_repro"]

[tool.ruff]
line-length = 100
target-version = "py39"
