name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline, zero dependencies)
        run: python -m unittest discover -v
      - name: Offline stub bench (deterministic, no network)
        if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        run: python scripts/run_bench.py
